name: Docker images

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: docker-${{ github.ref }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - filter: "@kynos/bot..."
            target: bot
          - filter: ""
            target: web
    steps:
      - uses: actions/checkout@v5

      - id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/kynos-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}

      - id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short,prefix=

      - uses: docker/build-push-action@v6
        with:
          build-args: |
            INSTALL_FILTER=${{ matrix.filter }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          context: .
          labels: ${{ steps.tags.outputs.labels }}
          outputs: type=registry,ref=${{ steps.meta.outputs.image }},image-manifest=true,oci-mediatypes=true,compression=zstd,compression-level=7,force-compression=true
          provenance: mode=min
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          target: ${{ matrix.target }}
