services:
  bot:
    build:
      args:
        INSTALL_FILTER: "@kynos/bot..."
      context: .
      target: bot
    healthcheck:
      disable: true
    image: ghcr.io/ilazer/kynos-bot:latest
    init: true
    restart: unless-stopped
    volumes:
      - kynos-data:/data

  web:
    build:
      context: .
      target: web
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      KYNOS_DATA_DIR: /data
      PORT: "3000"
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
    image: ghcr.io/ilazer/kynos-web:latest
    init: true
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - kynos-data:/data

volumes:
  kynos-data:
