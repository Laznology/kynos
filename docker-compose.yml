services:
  bot:
    build:
      args:
        INSTALL_FILTER: "@kynos/bot..."
      context: .
      target: bot
    healthcheck:
      disable: true
    image: ghcr.io/ilazer/kynos-bot:latest
    init: true
    restart: unless-stopped
    volumes:
      - kynos-data:/data

  web:
    build:
      context: .
      target: web
    environment:
      KYNOS_DATA_DIR: /data
      PORT: "3000"
    image: ghcr.io/ilazer/kynos-web:latest
    init: true
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - kynos-data:/data

volumes:
  kynos-data:
